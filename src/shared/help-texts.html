<!-- Shared markup: the help texts both tools have. Used by both tools: the build puts it where a page.html has a
     line "SHARED help-texts.html" in a comment (see src/assemble.js). -->
<template id="help-years">
  <h2>Photos taken in a certain period</h2>
  <p>
    Checks the photos Google shows by default at a spot, normally the newest. Google gives each photo's month
    and year, so the period can start and end in any month, from May 2007, when Street View began. "Now"
    always means the current month.
  </p>
  <p>Older photos are rarer and take longer to find.</p>
</template>
<template id="help-tilt">
  <h2>Tilt</h2>
  <p>
    How far the camera looks up or down: +90° straight up at the sky, 0° level, −90° straight down at the
    road. Drag the arrow, or type the angle.
  </p>
  <p>
    With "Random, within a range", every location gets its own tilt between the two angles, set with the two
    handles. Looking far up or down is rarely useful, so the range is −20° to 20° to start with.
  </p>
</template>
<template id="help-zoom">
  <h2>Zoom</h2>
  <p>
    How far the camera is zoomed in when a location opens, in map-making.app and in GeoGuessr: 0 is the widest
    view, 1 about Street View's normal view, and each step of 1 about twice as close. 4 is the closest. Steps
    in between, such as 1.5, work too.
  </p>
  <p>
    With "Random, within a range", every location gets its own zoom between the two numbers, 0 to 2 to start
    with.
  </p>
</template>
<template id="help-apiKey">
  <h2>Google API key</h2>
  <p>
    The search asks Google's Street View service, which needs a key with the Maps JavaScript API enabled. Your
    key is kept only until you close this tab, and only sent to Google.
  </p>
</template>
<template id="help-giveUpAfter">
  <h2>Giving up on a country</h2>
  <p>
    The number of random spots in a row that bring no new location for a country. Where matching locations are
    rare, the search then moves on; at the end you can fill the gap from the other countries.
  </p>
  <p>
    Untick it to never give up: the search then keeps trying in every country until it has all the locations
    or you stop it, however long that takes. Where there are hardly any matching locations, it may not end on
    its own.
  </p>
</template>
<template id="help-landscape">
  <h2>Landscape</h2>
  <p>
    Keeps only locations in a forest, on farmland, in grassland or shrubland, or on bare ground or in a
    desert. With the tag ticked in "Map file", each location also gets its landscape as a tag: "Forest",
    "Farmland", "Grassland" or "Bare ground".
  </p>
  <p>
    It goes by the European Space Agency's map of what covers the ground, for 2021, reduced to what covers
    most of each square of about 1 km (water does not count). So a location gets what its road runs through: a
    road through mostly fields is farmland, even beside a small wood. Where fields and woods mix, the larger
    part wins, and about one square in four may not match what you see on the ground.
  </p>
  <p>
    Towns are not a landscape here: use "Town or countryside" for those. Ice, wetland and tundra are left out
    too, so with a landscape chosen, locations there are not kept, and they get no tag.
  </p>
  <p>
    The map is loaded in pieces of 10° × 10°, only for the areas a search looks at, usually a few hundred KB
    for a country. A line under the choice says while it loads.
  </p>
  <p>Source: ESA WorldCover 10 m 2021 v200, European Space Agency (Zanaga et al., 2022), CC BY 4.0.</p>
</template>
<template id="help-settlement">
  <h2>Town or countryside</h2>
  <p>
    Keeps only locations in a town or village, or only those in the countryside. A town or village here is any
    place where at least 500 people live close together, at least 300 per km². The countryside is the rest:
    fields, forests, mountains, deserts and scattered houses.
  </p>
  <p>
    It goes by the European Commission's map of where people live, in squares of 1 km, for 2020. So at the
    edge of a town a location may fall on either side, and a lonely farm can count as a village where other
    houses are near.
  </p>
  <p>
    The map is a 2 MB file, loaded only when you choose this or tick the tag "Town" or "Countryside". A line
    under the choice says while it loads.
  </p>
  <p>
    Source: GHS-SMOD R2023A, European Commission, Joint Research Centre (Schiavina, Melchiorri and Pesaresi,
    2023), CC BY 4.0.
  </p>
</template>
<template id="help-parallel">
  <h2>Lookups at the same time</h2>
  <p>
    How many random spots the search asks Google about at once. It starts with 25. More lookups at the same
    time usually means a faster search, especially where most random spots find nothing, as in large, sparsely
    covered countries. It does not change how many lookups a search needs, only how quickly they are sent.
  </p>
  <p>The risks of a higher number:</p>
  <ul>
    <li>
      Google may answer more slowly, or refuse some lookups for a while when too many come in at once. Refused
      lookups appear as "failed lookups" under the progress bar. After 20 in a row, the search stops, and you
      can continue it later.
    </li>
    <li>A limit set on your Google key, such as lookups per minute, is reached sooner.</li>
    <li>
      A slow computer or connection may not keep up, so the page can feel sluggish while the search runs.
    </li>
    <li>
      When a country fills up, the lookups already under way still finish, so a few more lookups than needed
      are made.
    </li>
  </ul>
  <p>If failed lookups start to appear, try a lower number, such as 12 or 6. At most 50.</p>
</template>
<template id="help-searchLog">
  <h2>Search log</h2>
  <p>
    Only needed for debugging, or to find out how to make a search faster. You do not need it to make maps.
  </p>
  <p>
    Ticked, the search notes everything it does: each random spot, the panorama Google gives for it (with the
    road names on its arrows), and whether it became a location or why not. When a search has run, "Download
    the search log" under the counters saves it as a file, which you can pass on to whoever looks into a
    problem. It never holds your Google key.
  </p>
  <p>
    A very long search keeps only the first 20,000 and the latest 20,000 entries, plus the counters every 30
    seconds, so the file stays below about 6 MB. The log is kept until the next search, not when the page is
    closed.
  </p>
</template>
<template id="help-sizeLimit">
  <h2>Map file size</h2>
  <p>
    The largest map file you want, in whole MB: 20 MB to start with, the most some places take in one upload,
    such as Discord, where many maps are shared. The download button shows the file's size.
  </p>
  <p>
    When a search ends with a larger file, you can make it smaller. Each country keeps its share of the
    locations, and either the locations closest to others are dropped, for an even spread, or random ones. You
    can undo it until the next search. Untick it for no limit.
  </p>
</template>
